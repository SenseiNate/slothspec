[project]
name = "slothspec"
version = "0.4.1"
description = "Local requirements linter: drop a spec in, get a redline back. Hybrid grading and rewriting on open-weight Gemma 4 through Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "python-docx>=1.1", "pdfplumber>=0.11"]

[project.scripts]
slothspec = "slothspec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slothspec"]
